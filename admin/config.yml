backend:
  name: github
  repo: kgomotso-nacane/WeaveGallery
  branch: feature

media_folder: "src/images"
public_folder: "/src/images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - label: "Home Page"
        name: "index"
        file: "index.html"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
